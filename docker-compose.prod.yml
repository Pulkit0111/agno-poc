# Production stack for the Bott POC — Postgres + the Python app + the web console.
# This is the supported deploy path:
#
#   cp .env.example .env   # fill in the required vars (see docs/SETUP.md)
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Topology: the console is the ONLY entry point — it publishes on 127.0.0.1:3000 and
# proxies /api/*, /slack/* and /webhook/* to the bott service over the internal docker
# network (BOTT_API_ORIGIN below). Neither bott nor Postgres publishes a host port —
# bott's native AgentOS API has weak auth, so it stays reachable only from the console.
#
# INGRESS is provided by the deployer: point your own reverse proxy / tunnel (nginx,
# Caddy, Traefik, cloudflared, an LB, …) at http://127.0.0.1:3000 and terminate HTTPS
# there. Set CONSOLE_BASE_URL in .env to that public HTTPS URL. (If your proxy isn't on
# this host, change the console `ports:` bind below to a reachable address or add the
# proxy as a service on this compose network.)
#
# All configuration (including BOTT_PORT and POSTGRES_PASSWORD) comes from ./.env —
# compose reads it both for ${...} interpolation here and via env_file for the containers.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bott
      POSTGRES_USER: bott
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No ports: — Postgres is only reachable on the internal docker network.
    # (Backups: `docker compose -f docker-compose.prod.yml exec -T db pg_dump ...`.)
    volumes:
      - bott_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bott -d bott"]
      interval: 5s
      timeout: 3s
      retries: 10

  bott:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bott:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/bott
      BOTT_PORT: ${BOTT_PORT:-7777}
      # The ONE codex auth store: the CLI keeps (and refreshes) the org ChatGPT login here.
      # A named volume so `codex login` survives image rebuilds/redeploys — log in once via
      # the console's Connect ChatGPT button (device auth) and every codex exec call
      # (chat/build/review/triage/memory) shares it.
      CODEX_HOME: /var/lib/bott/codex
      # codex's bubblewrap sandbox needs unprivileged user namespaces, generally unavailable
      # in containers — the container itself is the isolation boundary here.
      BOTT_CODEX_DISABLE_SANDBOX: "1"
    volumes:
      - bott_codex:/var/lib/bott/codex
    # No ports: — deliberately NOT published to the host. The AgentOS API's native auth
    # is weak; all external traffic enters through the console, which proxies to
    # http://bott:${BOTT_PORT} over the internal network.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; p=os.environ.get('BOTT_PORT','7777'); sys.exit(0 if urllib.request.urlopen(f'http://localhost:{p}/readyz', timeout=4).status < 500 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  console:
    build:
      context: console
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bott:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BOTT_API_ORIGIN: http://bott:${BOTT_PORT:-7777}
    # Loopback bind keeps the console off the LAN — the deployer's reverse proxy / tunnel
    # on this host dials 127.0.0.1:3000 and is the only way in. Change this bind if your
    # ingress runs elsewhere.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # The runner image is node:22-slim (no curl/wget); node's global fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  bott_pgdata:
  bott_codex:
